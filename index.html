<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercearia Mania</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#333}
header{background:#b51f2b;color:white;padding:22px 15px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0}
nav{background:#fff;padding:12px;display:flex;gap:10px;overflow:auto}
nav button{border:0;background:#eee;padding:10px 15px;border-radius:20px;white-space:nowrap;cursor:pointer}
nav button.active{background:#b51f2b;color:white}
main{padding:15px;max-width:1100px;margin:auto}
h2{font-size:21px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.product{background:white;border-radius:12px;overflow:hidden;padding-bottom:12px;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:145px;object-fit:cover}
.product h3{font-size:15px;margin:10px}
.price{color:#b51f2b;font-weight:bold;margin:10px}
.product button,.finish{background:#b51f2b;color:white;border:0;padding:11px;border-radius:8px;cursor:pointer}
.product button{margin:0 10px;width:calc(100% - 20px)}
#cart{background:white;padding:18px;border-radius:12px;margin-top:25px}
.cart-item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:10px 0}
.cart-item button{border:0;background:#eee;padding:5px 9px;cursor:pointer}
.total{font-size:21px;font-weight:bold;color:#b51f2b}
.finish{width:100%;font-size:16px;margin-top:12px}
input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1>🛒 MERCEARIA MANIA</h1>
<p>Seu mercado pertinho de você!</p>
</header>

<nav id="categories"></nav>

<main>
<h2 id="categoryTitle">Todos os produtos</h2>
<div class="products" id="products"></div>

<section id="cart">
<h2>🛒 Meu carrinho</h2>
<div id="cartItems">Seu carrinho está vazio.</div>
<p class="total">Total: R$ <span id="total">0,00</span></p>

<h2>Finalizar pedido</h2>
<input id="customer" placeholder="Seu nome">
<input id="address" placeholder="Endereço para entrega (se necessário)">
<select id="delivery">
<option value="Entrega">Entrega grátis</option>
<option value="Retirada na loja">Retirar na mercearia</option>
</select>
<select id="payment">
<option>Pix</option>
<option>Dinheiro</option>
<option>Cartão</option>
</select>
<button class="finish" onclick="sendOrder()">Enviar pedido pelo WhatsApp</button>
</section>
</main>

<footer>Mercearia Mania ❤️</footer>

<script>
const whatsapp = "SEU_NUMERO_AQUI";

const products = [
{name:"Coca-Cola 2L",price:10.00,category:"Bebidas",image:"https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400"},
{name:"Chocolate",price:5.99,category:"Doces",image:"https://images.unsplash.com/photo-1548907040-4d42f4f8a6d3?w=400"},
{name:"Sorvete",price:15.00,category:"Sorvetes",image:"https://images.unsplash.com/photo-1501446529957-6226bd447c46?w=400"},
{name:"Hambúrguer",price:12.00,category:"Congelados",image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},
{name:"Batata",price:6.00,category:"Alimentos",image:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400"}
];

let cart=[];
let selected="Todos";

const categories=["Todos","Doces","Bebidas","Sorvetes","Congelados","Alimentos"];

function money(v){return v.toFixed(2).replace(".",",")}

function renderCategories(){
document.getElementById("categories").innerHTML=categories.map(c=>
<button class="${selected===c?'active':''}" onclick="filter('${c}')">${c}</button>
).join("");
}

function filter(c){
selected=c;
renderCategories();
renderProducts();
}

function renderProducts(){
const list=selected==="Todos"?products:products.filter(p=>p.category===selected);
document.getElementById("categoryTitle").textContent=selected==="Todos"?"Todos os produtos":selected;
document.getElementById("products").innerHTML=list.map((p)=>{
const index=products.indexOf(p);
return `<article class="product">
<img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3>
<p class="price">R$ ${money(p.price)}</p>
<button onclick="add(${index})">+ Adicionar ao carrinho</button>
</article>`;
}).join("");
}

function add(i){
const found=cart.find(p=>p.name===products[i].name);
if(found)found.qty++;
else cart.push({...products[i],qty:1});
renderCart();
}

function change(i,n){
cart[i].qty+=n;
if(cart[i].qty<=0)cart.splice(i,1);
renderCart();
}

function renderCart(){
const box=document.getElementById("cartItems");
if(!cart.length)box.innerHTML="Seu carrinho está vazio.";
else box.innerHTML=cart.map((p,i)=>`
<div class="cart-item">
<span>${p.name}<br>R$ ${money(p.price*p.qty)}</span>
<span>
<button onclick="change(${i},-1)">−</button>
${p.qty}
<button onclick="change(${i},1)">+</button>
</span>
</div>`).join("");
const total=cart.reduce((s,p)=>s+p.price*p.qty,0);
document.getElementById("total").textContent=money(total);
}

function sendOrder(){
if(!cart.length){alert("Adicione produtos ao carrinho!");return;}
const name=document.getElementById("customer").value.trim();
if(!name){alert("Digite seu nome!");return;}
const delivery=document.getElementById("delivery").value;
const address=document.getElementById("address").value.trim();
if(delivery==="Entrega"&&!address){alert("Digite seu endereço!");return;}
const payment=document.getElementById("payment").value;
const total=cart.reduce((s,p)=>s+p.price*p.qty,0);
let msg=🛒 *PEDIDO - MERCEARIA MANIA*\n\nCliente: ${name}\n\n;
cart.forEach(p=>msg+=${p.qty}x ${p.name} - R$ ${money(p.price*p.qty)}\n);
msg+=\n*TOTAL: R$ ${money(total)}*\n\n${delivery};
if(address)msg+=\nEndereço: ${address};
msg+=\nPagamento: ${payment};
window.open(https://wa.me/${whatsapp}?text=${encodeURIComponent(msg)},"_blank");
}

renderCategories();
renderProducts();
renderCart();
</script>
</body>
</html>
